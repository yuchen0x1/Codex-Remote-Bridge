name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server checks & tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test

  android:
    name: Android tests, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/CodexMax
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: codexmax-debug-apk
          path: android/CodexMax/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 桌面壳层编译门禁。v4.1.0 把默认传输改成 HTTPS，但 Windows/macOS 壳仍写死 http，
  # 这个缺口正是因为没有壳层 CI 才漏到发布版，必须补上。
  windows-launcher:
    name: Windows launcher build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows/CodexMini
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CodexMiniWin.csproj

      - name: Build
        run: dotnet build CodexMiniWin.csproj -c Release --no-restore

  macos-launcher:
    name: macOS launcher build
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build (Release)
        run: |
          # This prepares the ignored service/runtime resources before Xcode runs.
          APP_PATH="$RUNNER_TEMP/Codex Remote Bridge.app" \
            bash scripts/build-codex-mini-app.sh
