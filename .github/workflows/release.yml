name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v4.2.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify source and release version
    # Integration tests start the desktop bridge, which supports Windows/macOS.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          [[ "$tag" == "$package_version" ]]
          echo "Release version: $package_version"
          node scripts/check-release-version.js "$RELEASE_TAG"

      - name: Syntax check all modules
        run: npm run check

      - name: Run tests
        run: npm test

  android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android/CodexMax
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android signing when secrets are available
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" || -z "${ANDROID_KEY_ALIAS:-}" || -z "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "ANDROID_SIGNING=unsigned" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-signing.keystore
          cat > release-signing.properties <<EOF
          storeFile=release-signing.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF
          echo "ANDROID_SIGNING=signed" >> "$GITHUB_ENV"

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Normalize APK name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../dist/android
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" "../../dist/android/ChatGPT-AZ-Android-v${RELEASE_TAG#v}.apk"

      - name: Upload Android asset
        uses: actions/upload-artifact@v4
        with:
          name: release-android-${{ env.RELEASE_TAG }}
          path: dist/android/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: powershell
        run: .\scripts\build-codex-max-windows-installer.ps1 -SelfContained

      - name: Verify Windows payload
        shell: pwsh
        run: |
          $payload = 'dist/windows/Codex Remote Bridge InstallerPayload'
          $files = @(Get-ChildItem -LiteralPath $payload -Recurse -File)
          $forbidden = @($files | Where-Object { $_.Name -match '(?i)(\.p12$|\.jks$|\.pdb$|release-signing\.properties$|^state\.json$|^runtime\.json$)' })
          if ($forbidden.Count) { throw 'Private state, signing material or debug symbols found in payload' }
          if (-not (Test-Path -LiteralPath "$payload/LICENSE")) { throw 'Missing license' }
          $version = (Get-Content -LiteralPath "$payload/Resources/CodexMaxProject/package.json" -Raw | ConvertFrom-Json).version
          if ($version -ne $env:RELEASE_TAG.TrimStart('v')) { throw 'Embedded service version mismatch' }
          if (-not (Test-Path -LiteralPath "$payload/Resources/CodexMaxProject/public/release-notes.html")) { throw 'Missing release notes' }
          Write-Host "Verified $($files.Count) Windows payload files; service $version"

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ env.RELEASE_TAG }}
          path: dist/windows/installer/*.exe
          if-no-files-found: error

  macos:
    name: Build macOS installer
    runs-on: macos-15
    timeout-minutes: 60
    needs: verify
    permissions:
      contents: read
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build macOS installer
        run: |
          chmod +x scripts/build-codex-mini-installer.sh
          scripts/build-codex-mini-installer.sh

      - name: Verify macOS payload
        run: |
          app=".build/codex-mini-installer/payload/Applications/Codex Remote Bridge.app"
          service="$app/Contents/Resources/CodexMiniProject"
          node -e 'const fs = require("fs"); if (JSON.parse(fs.readFileSync(process.argv[1])).version !== process.argv[2]) process.exit(1)' "$service/package.json" "${RELEASE_TAG#v}"
          test -f "$service/LICENSE"
          test -f "$service/public/release-notes.html"
          if find "$app" -type f \( -name '*.p12' -o -name '*.jks' -o -name 'release-signing.properties' -o -name 'state.json' -o -name 'runtime.json' \) | grep -q .; then
            echo 'Private state or signing material found in payload' >&2
            exit 1
          fi
          file "$app/Contents/Resources/node/node"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"

      - name: Upload macOS asset
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ env.RELEASE_TAG }}
          path: dist/*Installer.pkg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify, android, windows, macos]
    permissions:
      contents: write
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Android asset
        uses: actions/download-artifact@v4
        with:
          name: release-android-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Download Windows asset
        uses: actions/download-artifact@v4
        with:
          name: release-windows-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Download macOS asset
        uses: actions/download-artifact@v4
        with:
          name: release-macos-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Generate checksums and update manifest
        run: |
          set -euo pipefail
          test -n "$(find release-assets -maxdepth 1 -type f | head -n 1)"
          node scripts/release-manifest.js \
            --assets-dir release-assets \
            --version "${RELEASE_TAG#v}" \
            --tag "$RELEASE_TAG" \
            --repository "${GITHUB_REPOSITORY}"
          cat release-assets/update-manifest.json

      - name: Refuse to overwrite an existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; use a new version tag instead of overwriting it." >&2
            exit 1
          fi

      - name: Create GitHub Release without overwriting an existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          files: release-assets/*
          # Publish explicitly after verifying assets and Android signing.
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
